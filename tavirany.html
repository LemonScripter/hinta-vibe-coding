<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store">
<title>Távirányító · jegyzet</title>
<style>
:root{--bg:#f6f4ee;--fg:#1d2a2c;--muted:#556569;--card:#fff;--line:#d8d4c6;--accent:#0f766e;--accent-soft:#d9efec;--warn:#9a4a07;--warn-soft:#fdf0d9;--bad:#b42318;--ok:#1f6f37}
@media (prefers-color-scheme:dark){:root{--bg:#101719;--fg:#e8efee;--muted:#9fb0b3;--card:#172123;--line:#2a393c;--accent:#4fd1c5;--accent-soft:#173533;--warn:#f5b35a;--warn-soft:#38290f;--bad:#ff8a7a;--ok:#7fd99a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;max-width:100vw;overflow-x:hidden}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
header{display:flex;gap:.7rem;align-items:center;padding:.5rem .8rem;background:var(--card);border-bottom:2px solid var(--accent)}
#dot{width:.8rem;height:.8rem;border-radius:50%;background:var(--muted);flex:none}
#dot.on{background:var(--ok)} #dot.off{background:var(--bad)}
#time{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.5rem}
.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-bad{color:var(--bad)}
.sp{flex:1}
#cnt{color:var(--muted);font-weight:700}
main{flex:1;overflow:auto;overflow-x:hidden;padding:.8rem 1rem;min-width:0;overflow-wrap:anywhere}
.part{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:1.35rem;margin:.1rem 0 .5rem;line-height:1.2}
.hint{background:var(--warn-soft);color:var(--warn);border-radius:.4rem;padding:.4rem .7rem;font-weight:700;margin:.5rem 0}
.nb p{margin:.55rem 0;font-size:1.12rem}
.nb .say{border-left:.3rem solid var(--accent);padding-left:.7rem}
.nb .ask{border-left:.3rem solid var(--warn);padding-left:.7rem}
.nb .do{border-left:.3rem solid var(--muted);padding-left:.7rem;color:var(--muted)}
.next{color:var(--muted);font-size:.9rem;margin-top:1rem}
footer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:.6rem;padding:.6rem .8rem calc(.6rem + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
button{min-width:0;font:inherit;font-weight:800;font-size:1.3rem;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:.7rem;padding:1rem .5rem;touch-action:manipulation}
button.go{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:active{filter:brightness(.9)}
#msg{padding:2rem 1rem;text-align:center;color:var(--muted)}
.note-warn{background:var(--warn-soft);color:var(--warn);border-radius:.4rem;padding:.4rem .7rem;font-size:.9rem;margin-bottom:.6rem}
</style>
</head>
<body>
<header><span id="dot"></span><span id="time">00:00</span><span id="plan" style="color:var(--muted);font-size:.85rem"></span><span class="sp"></span><span id="cnt"></span></header>
<main id="main"><div id="msg">Betöltés…</div></main>
<footer><button id="prev">‹ Vissza</button><button id="next" class="go">Tovább ›</button></footer>
<script>
(function(){
  var KEY = new URLSearchParams(location.search).get('k');
  var main = document.getElementById('main'), dot = document.getElementById('dot');
  var slides = [], i = 0, t0 = null, seenV = -1, END = 31, MAXSLIDES = 13;
  var inflight = false, dirty = false, polling = false, fails = 0, offlineNotes = false;
  if (!KEY) { main.innerHTML = '<div id="msg">Hiányzik a kód. Olvasd le a laptopon megjelenő QR-kódot (az élő változatban nyomj <b>K</b> billentyűt).</div>'; return; }

  // Hálózat: időkorlát + gyorsítótár-kerülés; a megkésett válaszok a verzió alapján kiszűrődnek.
  function net(method, body){
    var ac = new AbortController(), tm = setTimeout(function(){ ac.abort(); }, 6000);
    var url = '/api/sync?k=' + encodeURIComponent(KEY) + (method === 'GET' ? '&_=' + Date.now() : '');
    return fetch(url, {method: method, cache: 'no-store', signal: ac.signal, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined})
      .then(function(r){ clearTimeout(tm); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }, function(e){ clearTimeout(tm); throw e; });
  }
  function setDot(ok){ fails = ok ? 0 : fails + 1; dot.className = (ok || fails < 3) ? 'on' : 'off'; }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function planOf(k){
    var s = slides[k]; if (!s || s.t === null) return null;
    var b = END;
    for (var j = k + 1; j < slides.length; j++) { if (slides[j].t !== null) { b = slides[j].t; break; } }
    return {a: s.t, b: b};
  }
  function render(){
    var s = slides[i]; if (!s) return;
    var sec = t0 ? Math.max(0, Math.floor((Date.now() - t0) / 1000)) : 0, el = sec / 60, p = planOf(i);
    var tm = document.getElementById('time'); tm.textContent = pad(Math.floor(sec / 60)) + ':' + pad(sec % 60);
    var late = p ? el - p.b : 0;
    tm.className = (!t0 || !p) ? '' : (late > 2 ? 'st-bad' : (late > 0.5 ? 'st-warn' : 'st-ok'));
    document.getElementById('plan').textContent = p ? 'terv ' + p.a + '–' + p.b + '′' : '';
    document.getElementById('cnt').textContent = (i + 1) + '/' + slides.length;
    var showHint = late > 0.5 ? (s.cut || 'Csúszol: rövidíts, ugorj a következő részre.') : '';
    main.innerHTML = (offlineNotes ? '<div class="note-warn">A jegyzetek nem töltődtek be: a lapozás működik, a jegyzet nem látszik.</div>' : '') +
      '<div class="part">' + s.part + '</div><h1>' + s.title + '</h1>' +
      (showHint ? '<div class="hint">' + showHint + '</div>' : '') +
      '<div class="nb">' + s.notes + '</div>' +
      '<div class="next">Következő: ' + (slides[i + 1] ? slides[i + 1].title : 'vége') + '</div>';
  }

  // Küldés: egyszerre egy kérés van úton; a közben érkező újabb helyi változás utána megy.
  function flush(){
    if (inflight || !dirty) return;
    inflight = true; dirty = false;
    net('POST', {i: i, t0: t0})
      .then(function(st){ seenV = Math.max(seenV, st.v); if (st.t0) t0 = st.t0; setDot(true); })
      .catch(function(){ dirty = true; setDot(false); })
      .then(function(){ inflight = false; if (dirty) setTimeout(flush, 400); });
  }
  function go(n){
    n = Math.max(0, Math.min(slides.length - 1, n)); if (n === i) return;
    i = n; main.scrollTop = 0; render(); dirty = true; flush();
  }
  function poll(){
    if (polling || inflight || dirty) return;
    polling = true;
    net('GET')
      .then(function(st){
        setDot(true);
        if (inflight || dirty) return;          // közben helyi változás történt
        if (st.v <= seenV) return;              // megkésett, régebbi válasz
        seenV = st.v;
        if (st.t0) t0 = st.t0; else if (st.t0 === null) t0 = null;
        if (typeof st.i === 'number' && st.i !== i && st.i < slides.length) { i = st.i; main.scrollTop = 0; }
        render();
      })
      .catch(function(){ setDot(false); })
      .then(function(){ polling = false; });
  }
  document.getElementById('prev').onclick = function(){ go(i - 1); };
  document.getElementById('next').onclick = function(){ go(i + 1); };
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === ' ') go(i + 1); else if (e.key === 'ArrowLeft') go(i - 1);
  });
  function wake(){ try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); } catch (e) {} }
  wake();
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { wake(); poll(); } });
  window.addEventListener('online', function(){ dirty = true; flush(); poll(); });

  // A jegyzetek az élő változat oldalából jönnek; helyben is megőrizzük (ha elmegy a térerő, megvan).
  function parseNotes(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    return Array.prototype.map.call(doc.querySelectorAll('.slide'), function(s){
      var n = s.querySelector('.notes');
      return {title: s.getAttribute('aria-label') || '', part: s.getAttribute('data-part') || '',
              t: s.hasAttribute('data-t') ? +s.getAttribute('data-t') : null,
              notes: n ? n.innerHTML : '', cut: n ? (n.getAttribute('data-cut') || '') : ''};
    });
  }
  function loadNotes(){
    var ac = new AbortController(), tm = setTimeout(function(){ ac.abort(); }, 8000);
    return fetch('eloadas.html?_=' + Date.now(), {cache: 'no-store', signal: ac.signal})
      .then(function(r){ clearTimeout(tm); if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(html){ var sl = parseNotes(html); if (!sl.length) throw new Error('üres'); try { localStorage.setItem('hinta_jegyzet', JSON.stringify(sl)); } catch (e) {} return sl; })
      .catch(function(){
        clearTimeout(tm);
        try { var c = JSON.parse(localStorage.getItem('hinta_jegyzet') || 'null'); if (c && c.length) return c; } catch (e) {}
        offlineNotes = true;
        var sl = []; for (var k = 0; k < MAXSLIDES; k++) sl.push({title: (k + 1) + '. dia', part: '', t: null, notes: '', cut: ''});
        return sl;
      });
  }
  loadNotes().then(function(sl){
    slides = sl;
    return net('GET').catch(function(){ return {i: 0, t0: null, v: -1}; });
  }).then(function(st){
    seenV = st.v; if (st.t0) t0 = st.t0; if (typeof st.i === 'number' && st.i < slides.length) i = st.i;
    setDot(st.v >= 0); render();
    setInterval(poll, 800); setInterval(render, 1000);
  });
})();
</script>
</body>
</html>
